<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Dias entre Datas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h2>Calculadora de Dias</h2>
            </div>
            <div class="card-body">
                <p class="text-center">Insira as datas para calcular a quantidade de dias, considerando anos bissextos.</p>
                <form>
                    <div class="mb-3">
                        <label for="startDate" class="form-label">Data Inicial:</label>
                        <input type="date" id="startDate" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="endDate" class="form-label">Data Final:</label>
                        <input type="date" id="endDate" class="form-control">
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="calculateDays()">Calcular Dias</button>
                </form>
                <div id="result" class="mt-4 text-center"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Função para verificar se um ano é bissexto
        function isLeapYear(year) {
            return (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0));
        }

        // Função para calcular os dias entre duas datas
        function calculateDays() {
            const startDate = new Date(document.getElementById("startDate").value);
            const endDate = new Date(document.getElementById("endDate").value);
            const resultElement = document.getElementById("result");

            if (isNaN(startDate) || isNaN(endDate)) {
                resultElement.innerHTML = "<div class='alert alert-danger'>Por favor, insira datas válidas.</div>";
                return;
            }

            if (startDate > endDate) {
                resultElement.innerHTML = "<div class='alert alert-warning'>A data inicial deve ser anterior à data final.</div>";
                return;
            }

            let totalDays = 0;
            let currentYear = startDate.getFullYear();
            const endYear = endDate.getFullYear();

            // Calcular os dias ano a ano
            while (currentYear <= endYear) {
                const yearStart = currentYear === startDate.getFullYear() ? startDate : new Date(currentYear, 0, 1);
                const yearEnd = currentYear === endYear ? endDate : new Date(currentYear, 11, 31);
                const daysInYear = isLeapYear(currentYear) ? 366 : 365;

                const yearDays = (yearEnd - yearStart) / (1000 * 60 * 60 * 24) + 1;
                totalDays += yearDays;

                currentYear++;
            }

            resultElement.innerHTML = `<div class='alert alert-success'>O total de dias entre as datas é: ${Math.round(totalDays)} dias.</div>`;
        }
    </script>
</body>
</html>
